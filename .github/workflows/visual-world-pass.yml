name: Visual world pass checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "main.gd"
      - "main_v21_visual_pass2.gd"
      - "main_v24_visual_north_star.gd"
      - "main_v25_city_density.gd"
      - "main_v26_urban_hierarchy.gd"
      - "main_v27_growth_delight.gd"
      - "main_v28_city_birth_sequence.gd"
      - "main_v29_congestion_recovery.gd"
      - "main_v30_fresh_test_mode.gd"
      - "main_v31_device_stability.gd"
      - "main_v32_incremental_renderer.gd"
      - "main_v33_reset_control.gd"
      - "main_v34_mobile_hud.gd"
      - "main_v35_road_draw_map_scale.gd"
      - "tests/visual_world_pass_test.gd"
      - "tests/v25_city_density_test.gd"
      - "tests/v26_urban_hierarchy_test.gd"
      - "tests/v27_growth_delight_test.gd"
      - "tests/v28_city_birth_sequence_test.gd"
      - "tests/v29_congestion_recovery_test.gd"
      - "tests/v30_fresh_test_mode_test.gd"
      - "tests/v31_device_stability_test.gd"
      - "tests/v32_incremental_renderer_test.gd"
      - "tests/v33_reset_control_test.gd"
      - "tests/v34_mobile_hud_test.gd"
      - "tests/v35_road_draw_map_scale_test.gd"
      - "assets/jp_charset.txt"
      - ".github/workflows/visual-world-pass.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-world-pass:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Godot version
        run: godot --version

      - name: Validate project
        run: godot --headless --editor --path . --quit-after 1

      - name: Visual world fixture
        run: godot --headless --path . --script res://tests/visual_world_pass_test.gd

      - name: City density fixture
        run: godot --headless --path . --script res://tests/v25_city_density_test.gd

      - name: Urban hierarchy fixture
        run: godot --headless --path . --script res://tests/v26_urban_hierarchy_test.gd

      - name: Growth delight fixture
        run: godot --headless --path . --script res://tests/v27_growth_delight_test.gd

      - name: City birth sequence fixture
        run: godot --headless --path . --script res://tests/v28_city_birth_sequence_test.gd

      - name: Congestion recovery fixture
        run: godot --headless --path . --script res://tests/v29_congestion_recovery_test.gd

      - name: Fresh device-test mode fixture
        run: godot --headless --path . --script res://tests/v30_fresh_test_mode_test.gd

      - name: Device stability fixture
        run: godot --headless --path . --script res://tests/v31_device_stability_test.gd

      - name: Incremental renderer fixture
        run: godot --headless --path . --script res://tests/v32_incremental_renderer_test.gd

      - name: Reset control fixture
        run: godot --headless --path . --script res://tests/v33_reset_control_test.gd

      - name: Mobile HUD and font fixture
        run: godot --headless --path . --script res://tests/v34_mobile_hud_test.gd

      - name: Road draw and map scale fixture
        run: godot --headless --path . --script res://tests/v35_road_draw_map_scale_test.gd

      - name: Existing renderer regression
        run: godot --headless --path . --script res://tests/render_fixture_test.gd
