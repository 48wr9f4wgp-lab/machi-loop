name: Tier render signature checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "main_v19_release.gd"
      - "tests/tier_render_signature_test.gd"
      - ".github/workflows/tier-render-signature.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier-render-signature:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Godot version
        run: godot --version

      - name: Tier render signature fixture
        run: godot --headless --path . --script res://tests/tier_render_signature_test.gd
