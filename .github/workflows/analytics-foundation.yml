name: Analytics foundation checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "analytics/**"
      - "tests/analytics_*"
      - ".github/workflows/analytics-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-tests:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Godot version
        shell: bash
        run: godot --version

      - name: Analytics schema fixture
        shell: bash
        run: godot --headless --path . --script res://tests/analytics_schema_test.gd

      - name: Analytics controller fixture
        shell: bash
        run: godot --headless --path . --script res://tests/analytics_controller_test.gd
