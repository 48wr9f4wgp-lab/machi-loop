name: Build and deploy MACHI LOOP

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "machi-loop-pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"
          if [ -d "/root/.config/godot" ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/" || true
          fi
          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          godot --version
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_release.zip"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_nothreads_release.zip"

      - name: Validate Godot project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit-after 1 --verbose

      - name: Runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 --verbose 2>&1 | tee runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" runtime.log; then
            echo "Runtime smoke test found script errors"
            exit 1
          fi

      - name: Export Godot Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --path . --export-release "Web" "$EXPORT_DIR/web/index.html"
          touch build/web/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > build/web/build.txt

      - name: Verify Web build
        shell: bash
        run: |
          set -euxo pipefail
          test -f build/web/index.html
          test -n "$(find build/web -maxdepth 1 -name '*.wasm' -print -quit)"
          test -f build/web/build.txt

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
