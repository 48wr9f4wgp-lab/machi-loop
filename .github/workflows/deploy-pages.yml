name: Build and deploy MACHI LOOP

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "machi-loop-pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"
          if [ -d "/root/.config/godot" ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/" || true
          fi
          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          godot --version
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_release.zip"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_nothreads_release.zip"

      - name: Validate Godot project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit-after 1 --verbose

      - name: Runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 --verbose 2>&1 | tee runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" runtime.log; then
            echo "Runtime smoke test found script errors"
            exit 1
          fi

      - name: Export Godot Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --path . --export-release "Web" "$EXPORT_DIR/web/index.html"
          touch build/web/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > build/web/build.txt

      - name: Prepare iPhone standalone shell
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/machi_head.html <<'EOF'
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="MACHI LOOP">
          <meta name="theme-color" content="#17251F">
          <link rel="manifest" href="manifest.webmanifest">
          <script>
          (async function () {
            try {
              const response = await fetch('./build.txt?t=' + Date.now(), {cache: 'no-store'});
              const build = (await response.text()).trim();
              const url = new URL(window.location.href);
              if (build && url.searchParams.get('build') !== build) {
                url.searchParams.set('build', build);
                window.location.replace(url.toString());
              }
            } catch (_) {}
          })();
          </script>
          EOF

          if ! grep -q 'apple-mobile-web-app-capable' build/web/index.html; then
            awk '
              BEGIN {
                extra="";
                while ((getline line < "/tmp/machi_head.html") > 0) extra = extra line ORS;
                close("/tmp/machi_head.html");
                done=0;
              }
              /<\/head>/ && !done { printf "%s", extra; done=1 }
              { print }
            ' build/web/index.html > build/web/index.html.tmp
            mv build/web/index.html.tmp build/web/index.html
          fi

          if ! grep -q 'viewport-fit=cover' build/web/index.html; then
            sed -i 's/user-scalable=no/user-scalable=no, viewport-fit=cover/' build/web/index.html
          fi

          cat > build/web/manifest.webmanifest <<'EOF'
          {"name":"MACHI LOOP","short_name":"MACHI LOOP","start_url":"./","scope":"./","display":"standalone","orientation":"portrait","background_color":"#17251F","theme_color":"#17251F"}
          EOF

      - name: Verify Web build
        shell: bash
        run: |
          set -euxo pipefail
          test -f build/web/index.html
          test -n "$(find build/web -maxdepth 1 -name '*.wasm' -print -quit)"
          test -f build/web/build.txt
          test -f build/web/manifest.webmanifest
          grep -q 'apple-mobile-web-app-capable' build/web/index.html
          grep -q 'viewport-fit=cover' build/web/index.html

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
