name: Build and deploy MACHI LOOP

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "machi-loop-pages"
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ] && [ "$HOME" != "/root" ]; then
            cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"
          fi
          godot --version
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_release.zip" || test -f "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_release.zip"

      - name: Validate Godot project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . --editor --quit-after 1 --verbose

      - name: Export Godot Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web
          godot --headless --path . --verbose --export-release "Web" "$(pwd)/build/web/index.html"
          touch build/web/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > build/web/build.txt

      - name: Verify Web build
        shell: bash
        run: |
          set -euxo pipefail
          test -f build/web/index.html
          test -n "$(find build/web -maxdepth 1 -name '*.wasm' -print -quit)"
          test -f build/web/build.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
