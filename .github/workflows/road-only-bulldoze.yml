name: Road-only bulldoze checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-only-bulldoze:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prime Godot project metadata
        run: godot --headless --path . --editor --import
      - name: Road-only bulldoze fixture
        run: bash tools/run_godot_fixture.sh res://tests/road_only_bulldoze_test.gd
