name: Release guard hardening checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "main_v19_release.gd"
      - "tests/save_semantic_validation_test.gd"
      - "tests/tier_render_signature_test.gd"
      - "tests/pause_city_clock_test.gd"
      - ".github/workflows/save-semantic-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guards:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Godot version
        run: godot --version

      - name: Semantic save fixture
        run: godot --headless --path . --script res://tests/save_semantic_validation_test.gd

      - name: Tier render signature fixture
        run: godot --headless --path . --script res://tests/tier_render_signature_test.gd

      - name: Pause city clock fixture
        run: godot --headless --path . --script res://tests/pause_city_clock_test.gd
