name: Observability foundation checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  observability-tests:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Godot version
        run: godot --version

      - name: Observability schema fixture
        run: godot --headless --path . --script res://tests/observability_schema_test.gd

      - name: Observability controller fixture
        run: godot --headless --path . --script res://tests/observability_controller_test.gd
