name: Performance foundation checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "performance/**"
      - "tests/performance_*"
      - ".github/workflows/performance-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-tests:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Godot version
        shell: bash
        run: godot --version

      - name: Performance bands fixture
        shell: bash
        run: godot --headless --path . --script res://tests/performance_bands_test.gd

      - name: Performance monitor fixture
        shell: bash
        run: godot --headless --path . --script res://tests/performance_monitor_test.gd
